name: codeql
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          # El código del repo es TypeScript: javascript-typescript cubre JS + TS.
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
